<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="arm-token" content="__ARM_TOKEN__">
  <title>Arm control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="stage">
    <span id="link-led" class="link-led" role="status" aria-label="Offline"></span>

    <section class="controller" aria-label="Arm controller">
      <button id="estop" class="estop" type="button" aria-label="Emergency stop" title="Emergency stop">
        <span class="stop-mark"></span>
      </button>

      <div class="axis-bank">
        <div class="axis">
          <span class="axis-label">M1</span>
          <span id="m1-value" class="axis-value">—</span>
          <div class="rocker">
            <button type="button" data-jog-axis="m1" data-delta="1" aria-label="M1 up">▲</button>
            <button type="button" data-jog-axis="m1" data-delta="-1" aria-label="M1 down">▼</button>
          </div>
        </div>

        <div class="axis horizontal">
          <span class="axis-label">M2</span>
          <span id="m2-value" class="axis-value">—</span>
          <div class="rocker">
            <button type="button" data-jog-axis="m2" data-delta="-1" aria-label="M2 left">◀</button>
            <button type="button" data-jog-axis="m2" data-delta="1" aria-label="M2 right">▶</button>
          </div>
        </div>

        <div class="axis horizontal">
          <span class="axis-label">M3</span>
          <span id="m3-value" class="axis-value">—</span>
          <div class="rocker">
            <button type="button" data-jog-axis="m3" data-delta="-1" aria-label="M3 left">◀</button>
            <button type="button" data-jog-axis="m3" data-delta="1" aria-label="M3 right">▶</button>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
