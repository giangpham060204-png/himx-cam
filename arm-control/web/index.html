<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="arm-token" content="__ARM_TOKEN__">
  <title>Arm control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="stage">
    <span id="link-led" class="link-led" role="status" aria-label="Offline"></span>

    <section class="controller" aria-label="Arm controller">
      <svg class="pivot" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 8v20M50 72v20M8 50h20M72 50h20" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>

      <button id="estop" class="estop" type="button" aria-label="Emergency stop" title="Emergency stop">
        <span class="stop-mark"></span>
      </button>

      <button id="home" class="home" type="button" aria-label="Home all axes" title="Home all axes">
        HOME
      </button>

      <div class="axis-bank">
        <div class="axis">
          <span class="axis-label">M1</span>
          <span id="m1-value" class="axis-value">—</span>
          <div class="rocker">
            <button type="button" data-jog-axis="m1" data-delta="1" aria-label="M1 up"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
            <button type="button" data-jog-axis="m1" data-delta="-1" aria-label="M1 down"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
          </div>
        </div>

        <div class="axis horizontal">
          <span class="axis-label">M2</span>
          <span id="m2-value" class="axis-value">—</span>
          <div class="rocker">
            <button type="button" data-jog-axis="m2" data-delta="-1" aria-label="M2 left"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
            <button type="button" data-jog-axis="m2" data-delta="1" aria-label="M2 right"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
          </div>
        </div>

        <div class="axis horizontal">
          <span class="axis-label">M3</span>
          <span id="m3-value" class="axis-value">—</span>
          <div class="rocker">
            <button type="button" data-jog-axis="m3" data-delta="-1" aria-label="M3 left"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
            <button type="button" data-jog-axis="m3" data-delta="1" aria-label="M3 right"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
