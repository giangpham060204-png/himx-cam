<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="arm-token" content="__ARM_TOKEN__">
  <title>Arm control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="stage">
    <span id="link-led" class="link-led" role="status" aria-label="Connection offline"></span>

    <section class="controller" id="controller" aria-label="Arm controller">
      <button id="home" class="utility home" type="button" aria-label="Home all axes" title="Home all">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.2 12 4l8 7.2v8.3a1.5 1.5 0 0 1-1.5 1.5h-4.2v-5.5H9.7V21H5.5A1.5 1.5 0 0 1 4 19.5z"/>
        </svg>
      </button>

      <button id="connect" class="utility connect" type="button" aria-label="Connect to Moonraker" title="Connect">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M7.3 6.2a8 8 0 1 0 9.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button id="estop" class="estop" type="button" aria-label="Emergency stop" title="Emergency stop">
        <span class="stop-mark"></span>
      </button>

      <div class="stick-slot left">
        <span class="axis-tag tag-x">M1 <b id="m1-value">—</b></span>
        <span class="axis-tag tag-y">M3 <b id="m3-value">—</b></span>
        <div class="stick" data-stick="left" tabindex="0" role="application" aria-label="M1 horizontal, M3 vertical analog jog">
          <span class="stick-ring"></span>
          <span class="stick-knob"></span>
        </div>
      </div>

      <div class="stick-slot right">
        <span class="axis-tag tag-y">M2 <b id="m2-value">—</b><i>°</i></span>
        <div class="stick" data-stick="right" tabindex="0" role="application" aria-label="M2 vertical analog jog">
          <span class="stick-ring"></span>
          <span class="stick-knob"></span>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
